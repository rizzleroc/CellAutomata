<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04060a">
<meta name="description" content="THIS ISN'T A CELL — a real-time WebGL protocell whose bioluminescent membrane is driven by a live Gray–Scott reaction–diffusion simulation. The Unreal 5.8 hero concept, ported to Three.js so it runs in the browser.">
<title>THIS ISN'T A CELL — a live protocell</title>
<link rel="icon" href="../icon_v2.png">
<style>
  :root{ --teal:#3fe0d0; --mag:#d77bff; --ink:#ece7da; --muted:#8a95a0; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#04060a;color:var(--ink);overflow:hidden;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-font-smoothing:antialiased}
  @font-face{font-family:"Italiana";src:url("../web7/assets/fonts/Italiana-Regular.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"IBM Plex Mono";src:url("../web7/assets/fonts/IBMPlexMono-Regular.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"Crimson Pro";src:url("../web7/assets/fonts/CrimsonPro-Italic.ttf") format("truetype");font-style:italic;font-display:swap}
  #scene{position:fixed;inset:0;display:block}
  /* microscope HUD */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .frame{position:absolute;inset:22px;border:1px solid rgba(63,224,208,.16);border-radius:4px}
  .corner{position:absolute;width:26px;height:26px;border:2px solid rgba(63,224,208,.5)}
  .corner.tl{top:16px;left:16px;border-right:0;border-bottom:0}
  .corner.tr{top:16px;right:16px;border-left:0;border-bottom:0}
  .corner.bl{bottom:16px;left:16px;border-right:0;border-top:0}
  .corner.br{bottom:16px;right:16px;border-left:0;border-top:0}
  .reticle{position:absolute;top:50%;left:50%;width:46px;height:46px;transform:translate(-50%,-50%);opacity:.5}
  .reticle::before,.reticle::after{content:"";position:absolute;background:rgba(63,224,208,.6)}
  .reticle::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-.5px)}
  .reticle::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-.5px)}
  .rec{position:absolute;top:34px;left:40px;display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:#ff5470;box-shadow:0 0 10px #ff5470;animation:blink 1.4s steps(1) infinite}
  @keyframes blink{50%{opacity:.15}}
  .meta{position:absolute;top:34px;right:44px;text-align:right;font-size:11.5px;letter-spacing:.14em;color:var(--muted);line-height:1.7}
  .meta b{color:var(--teal);font-weight:400}
  .scalebar{position:absolute;bottom:44px;left:44px;font-size:11px;letter-spacing:.12em;color:var(--muted)}
  .scalebar .bar{display:inline-block;width:120px;height:5px;border:1px solid rgba(236,231,218,.5);border-top:0;margin-right:9px;vertical-align:2px}
  .readout{position:absolute;bottom:44px;right:44px;font-size:11px;letter-spacing:.1em;color:var(--muted);text-align:right;line-height:1.7}
  /* title */
  .title{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);text-align:center;transition:opacity 1.4s ease}
  .title h1{font-family:"Italiana",serif;font-size:clamp(34px,6vw,74px);letter-spacing:.06em;color:var(--ink);text-shadow:0 0 40px rgba(63,224,208,.25)}
  .title p{font-family:"Crimson Pro",serif;font-style:italic;font-size:clamp(15px,2vw,22px);color:var(--muted);margin-top:6px}
  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10.5px;letter-spacing:.2em;color:rgba(138,149,160,.6);text-transform:uppercase}
  .home{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);pointer-events:auto;font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-decoration:none;border:1px solid rgba(236,231,218,.12);padding:5px 12px;border-radius:7px}
  .home:hover{color:var(--ink);border-color:var(--teal)}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04060a;z-index:20;color:var(--muted);font-size:12px;letter-spacing:.2em;transition:opacity .8s}
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/jsm/"
}}
</script>
</head>
<body>
<div class="loading" id="loading">CULTURING SPECIMEN…</div>
<canvas id="scene"></canvas>
<div class="hud" aria-hidden="true">
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="reticle"></div>
  <div class="rec"><span class="dot"></span> REC · LIVE</div>
  <div class="meta">SPECIMEN <b>PC-001</b><br>GRAY–SCOTT · <b>MITOSIS</b><br>Fk <b>0.0367 / 0.0649</b></div>
  <div class="scalebar"><span class="bar"></span>2 µm</div>
  <div class="readout" id="readout">mag <b>×1</b><br>t <span id="tt">0.0</span>s</div>
  <div class="title" id="title"><h1>THIS ISN'T A CELL</h1><p>it is a reaction, learning to divide</p></div>
  <a class="home" href="../">← cellauto</a>
  <div class="hint">drag to orbit · scroll to zoom</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ───────────────────────── live Gray–Scott (mitosis) → height texture ─────────────────────────
const G = 148, N = G*G;
let U = new Float32Array(N).fill(1), V = new Float32Array(N), Un = new Float32Array(N), Vn = new Float32Array(N);
const F = 0.0367, k = 0.0649, Du = 0.16, Dv = 0.08, SUB = 8;
(function seed(){ let s = 20260726 >>> 0; const r = () => { s = (s*1664525+1013904223)>>>0; return s/4294967296; };
  for (let b=0;b<40;b++){ const cx=(r()*G)|0, cy=(r()*G)|0;
    for (let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){ const x=(cx+dx+G)%G, y=(cy+dy+G)%G, i=y*G+x; V[i]=0.5; U[i]=0.3; } } })();
function rdStep(){
  for (let s=0;s<SUB;s++){
    for (let y=0;y<G;y++){ const ym=(y-1+G)%G, yp=(y+1)%G;
      for (let x=0;x<G;x++){ const xm=(x-1+G)%G, xp=(x+1)%G, i=y*G+x, u=U[i], v=V[i];
        const lu=(U[ym*G+xm]+U[ym*G+xp]+U[yp*G+xm]+U[yp*G+xp])*0.05+(U[ym*G+x]+U[yp*G+x]+U[y*G+xm]+U[y*G+xp])*0.2-u;
        const lv=(V[ym*G+xm]+V[ym*G+xp]+V[yp*G+xm]+V[yp*G+xp])*0.05+(V[ym*G+x]+V[yp*G+x]+V[y*G+xm]+V[y*G+xp])*0.2-v;
        const uvv=u*v*v; Un[i]=u+(Du*lu-uvv+F*(1-u)); Vn[i]=v+(Dv*lv+uvv-(F+k)*v); } }
    U.set(Un); V.set(Vn);
  }
}
const heightData = new Uint8Array(N);
const heightTex = new THREE.DataTexture(heightData, G, G, THREE.RedFormat, THREE.UnsignedByteType);
heightTex.wrapS = heightTex.wrapT = THREE.RepeatWrapping; heightTex.minFilter = heightTex.magFilter = THREE.LinearFilter; heightTex.needsUpdate = true;
function updateHeightTex(){ for (let i=0;i<N;i++){ let h=V[i]/0.36; heightData[i] = h<0?0:h>1?255:(h*255)|0; } heightTex.needsUpdate = true; }
for (let i=0;i<220;i++) rdStep(); updateHeightTex();   // warm up a dividing colony

// ───────────────────────── scene ─────────────────────────
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060a, 0.055);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 6.2);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.minDistance = 3.2; controls.maxDistance = 12; controls.enablePan = false; controls.target.set(0,0,0);

// bioluminescent protocell shader: Fresnel rim (teal) + magenta core, RD-driven surface + emissive
const cellUniforms = {
  heightMap:{value:heightTex}, dispScale:{value:0.34}, time:{value:0},
  rimColor:{value:new THREE.Color(0.10,0.92,1.0)}, coreColor:{value:new THREE.Color(0.85,0.12,0.72)},
  emissiveBoost:{value:1.0}, camPos:{value:new THREE.Vector3()}
};
const cellMat = new THREE.ShaderMaterial({
  uniforms: cellUniforms, transparent:true, blending:THREE.NormalBlending, depthWrite:false, side:THREE.FrontSide,
  vertexShader:`
    uniform sampler2D heightMap; uniform float dispScale; uniform float time;
    varying float vH; varying vec3 vWN; varying vec3 vWP;
    void main(){
      float h = texture2D(heightMap, uv).r;
      vH = h;
      vec3 p = position + normal * (h * dispScale * (0.85 + 0.15*sin(time*0.7)));
      vec4 wp = modelMatrix * vec4(p,1.0); vWP = wp.xyz;
      vWN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader:`
    uniform vec3 rimColor; uniform vec3 coreColor; uniform float emissiveBoost; uniform vec3 camPos;
    varying float vH; varying vec3 vWN; varying vec3 vWP;
    void main(){
      vec3 Vd = normalize(camPos - vWP);
      float fres = pow(1.0 - max(0.0, dot(vWN, Vd)), 3.4);
      float cell = smoothstep(0.30, 0.95, vH);          // where chemistry is dense = a cell
      vec3 col = fres * rimColor * 1.5 + coreColor * cell * 1.3;   // dark body, glowing rim + cells
      float a = clamp(fres*0.72 + cell*0.55 + 0.03, 0.0, 0.94);
      gl_FragColor = vec4(col * emissiveBoost, a);
    }`
});
const heroGeo = new THREE.IcosahedronGeometry(1.9, 64);
const hero = new THREE.Mesh(heroGeo, cellMat); scene.add(hero);

// satellite colony (same membrane, smaller) so the frame never reads sparse
const colony = new THREE.Group(); scene.add(colony);
{ let s = 7 >>> 0; const r = () => { s = (s*1664525+1013904223)>>>0; return s/4294967296; };
  const sGeo = new THREE.IcosahedronGeometry(1, 28);
  for (let i=0;i<7;i++){ const m = new THREE.Mesh(sGeo, cellMat);
    const a=r()*6.28, rr=3.1+r()*2.4, yy=(r()-0.5)*3.0, sc=0.25+r()*0.4;
    m.position.set(Math.cos(a)*rr, yy, Math.sin(a)*rr); m.scale.setScalar(sc);
    m.userData={a, rr, sp:0.1+r()*0.2}; colony.add(m); } }

// drifting motes (plankton/marine snow) for depth
{ const NP=1400, pos=new Float32Array(NP*3), col=new Float32Array(NP*3); let s=99>>>0; const r=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  for (let i=0;i<NP;i++){ const rr=2.5+r()*10, a=r()*6.28, y=(r()-0.5)*12;
    pos[i*3]=Math.cos(a)*rr; pos[i*3+1]=y; pos[i*3+2]=Math.sin(a)*rr;
    const t=r()<0.15; col[i*3]=t?0.85:0.10; col[i*3+1]=t?0.3:0.7; col[i*3+2]=t?0.9:0.85; }
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3)); pg.setAttribute('color',new THREE.BufferAttribute(col,3));
  const pm=new THREE.PointsMaterial({size:0.04,vertexColors:true,transparent:true,opacity:0.34,blending:THREE.AdditiveBlending,depthWrite:false});
  scene.add(new THREE.Points(pg,pm)); }

// ───────────────────────── post: bloom → grade/scan/vignette/grain ─────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.62, 0.6, 0.82);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, time:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    void main(){
      vec2 uv=vUv; vec3 c=texture2D(tDiffuse,uv).rgb;
      c.r*=1.02; c.b*=1.06;                                   // cool split
      float sy=fract(time*0.11);                              // signature scan sweep
      float band=smoothstep(0.03,0.0,abs(uv.y-sy));
      c+=band*vec3(0.10,0.30,0.36);
      float d=distance(uv,vec2(0.5)); c*=1.0-0.95*pow(d,2.3); // vignette
      float g=fract(sin(dot(uv*(time+1.0),vec2(12.9898,78.233)))*43758.5453);
      c+=(g-0.5)*0.05;                                        // grain
      gl_FragColor=vec4(c,1.0);
    }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); composer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); bloom.resolution.set(w,h); }
addEventListener('resize', resize); resize();

// ───────────────────────── loop ─────────────────────────
const clock = new THREE.Clock(); let t=0; const readTT=document.getElementById('tt'); const titleEl=document.getElementById('title');
let frames=0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  rdStep(); if ((frames++ & 1)===0) updateHeightTex();   // live division, every other frame
  hero.rotation.y += dt*0.05;
  colony.children.forEach(m=>{ m.userData.a += dt*m.userData.sp*0.1; const rr=m.userData.rr; m.position.x=Math.cos(m.userData.a)*rr; m.position.z=Math.sin(m.userData.a)*rr; m.rotation.y+=dt*0.2; });
  cellUniforms.time.value = t; grade.uniforms.time.value = t;
  camera.getWorldPosition(cellUniforms.camPos.value);
  // slow cinematic breathing push
  controls.update();
  composer.render();
  if (readTT) readTT.textContent = t.toFixed(1);
  if (t>6 && titleEl) titleEl.style.opacity='0';   // let the title breathe, then clear the frame
  if (t>0.4){ const l=document.getElementById('loading'); if(l&&l.style.opacity!=='0'){ l.style.opacity='0'; setTimeout(()=>l.remove(),800); } }
}
animate();
window.__protocell = { ok:true };   // smoke-test hook
</script>
</body>
</html>
