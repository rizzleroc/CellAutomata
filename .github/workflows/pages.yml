name: Pages

# Auto-deploy /docs (the static site: the ecosystem hub at docs/index.html +
# lab/ the flagship + generated plates) to GitHub Pages on every push to main.
# The root docs/index.html is the Catalytic-Silence hub; it links into lab/.
# (web7/ web8/ web9/ web10/ are redirect stubs into lab/; web/ web2/ web3/
# web6/ are v1-era clients kept on disk, unlinked and ungated.)
#
# One-time repo setup: Settings → Pages → Source → GitHub Actions.
# After that, every merge to main republishes the site.

on:
  push:
    branches: [main]
  # Run the JS gate on PRs too, so a broken client can't reach main. Build/
  # deploy are guarded to push events; PRs run the `test` job only.
  pull_request:
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Lab (flagship) smoke tests
        run: node docs/lab/tests/smoke.mjs      # engine + guide + instrument layers all parse and wire
      - name: Lab design-contract tests
        run: node docs/lab/tests/design.mjs     # Mark X identity + merged layers + shared fonts
      - name: Lab apparatus runtime verification
        run: |
          npm install three@0.162.0 --no-save --no-package-lock --silent
          node docs/lab/tests/runtime.mjs
      - name: Lab apparatus animation verification
        run: node docs/lab/tests/anim.mjs       # proves each experiment visibly runs
      - name: Lab controls-contract tests
        run: node docs/lab/tests/controls.mjs   # presets wired to real params + minerals localises
      - name: Lab guide intent-parser tests
        run: node docs/lab/tests/intents.mjs    # ask-the-amoeba request -> action mapping
      - name: Lab Pro gate (CatSilPro)
        run: node docs/lab/tests/pro.mjs        # rail + instrument export + 4000² plate on the shared token
      - name: Ontogeny engine + page tests
        run: |
          node docs/ontogeny/tests/ontogeny.mjs
          node docs/ontogeny/tests/smoke.mjs
      - name: Pond Water Analyzer smoke tests
        run: node docs/pondwater/tests/smoke.mjs
      - name: Pond Water Analyzer organism/anatomy verification
        run: node docs/pondwater/tests/life.mjs   # three already installed above
      - name: Slime Studio smoke test
        run: node docs/slime/tests/smoke.mjs
      - name: Studio (13 engines) smoke test
        run: node docs/studio/tests/smoke.mjs   # on-site studio + shared Pro token (4-way byte-identity)
      - name: Studio design contract
        run: node docs/studio/tests/design.mjs  # Catalytic Silence fonts/palette/a11y + honest-export UI
      - name: Studio engine-integrity gate
        run: node docs/studio/tests/controls.mjs # vm-driven kernels: controls sound, science moves, fidelity real
      - name: Front-door free/paid catalog gate
        run: node docs/tests/catalog.mjs        # catalog.js↔.json + index.html link/tier every tool
      - name: Shared-file parity gate
        run: node docs/tests/parity.mjs         # sem.js lab↔ontogeny + pro.js ×4 byte-identical
      - name: Murmuration smoke tests
        run: node docs/murmuration/tests/smoke.mjs
      - name: Murmuration flocking-science verification
        run: node docs/murmuration/tests/flock.mjs   # order emerges, bounded, banking, peregrine scatters
      - name: Murmuration render verification
        run: node docs/murmuration/tests/life.mjs     # three already installed above

  build:
    needs: test
    # Only build/deploy on a real push to main (or manual dispatch); PRs stop
    # after the `test` gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload /docs as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
