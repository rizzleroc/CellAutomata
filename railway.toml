# Railway service config.
#
# Forces the Dockerfile builder so Nixpacks doesn't try to install the
# cellauto Python package (Pillow/numpy build) — the Railway service only
# needs to serve docs/, not run the simulator.
#
# Route map (served from docs/):
#   /            → docs/index.html       (the Catalytic Silence hub — the front door)
#   /lab/        → the flagship origin-of-life lab
#   /studio/, /slime/, /murmuration/, /ontogeny/, /pondwater/  → the other clients
#   /generated/  → static stage plates the hub gallery references

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/"
healthcheckTimeout = 30
